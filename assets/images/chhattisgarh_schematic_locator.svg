<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" role="img" aria-labelledby="locator-title locator-desc">
  <title id="locator-title">Chhattisgarh Regional Schematic Locator</title>
  <desc id="locator-desc">Schematic diagram showing Northern Hills, Central Mahanadi Plains, and Southern Bastar Plateau regions of Chhattisgarh with key story locations.</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102C26"/>
      <stop offset="100%" stop-color="#173D32"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C3A56B"/>
      <stop offset="100%" stop-color="#e2cf9f"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-grad)"/>

  <!-- Subtle Contour Grid Lines -->
  <g stroke="#C3A56B" stroke-opacity="0.12" stroke-width="1" fill="none">
    <ellipse cx="400" cy="300" rx="360" ry="260"/>
    <ellipse cx="400" cy="300" rx="280" ry="200"/>
    <ellipse cx="400" cy="300" rx="200" ry="140"/>
    <line x1="120" y1="300" x2="680" y2="300" stroke-dasharray="4,6"/>
    <line x1="400" y1="60" x2="400" y2="540" stroke-dasharray="4,6"/>
  </g>

  <!-- Title & Disclaimer Header -->
  <text x="40" y="48" fill="#F6F2E9" font-family="'DM Serif Display', Georgia, serif" font-size="22" letter-spacing="0.5">CHHATTISGARH REGIONAL SCHEMATIC</text>
  <text x="40" y="70" fill="#A7B6A0" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">SCHEMATIC ORIENTATION ONLY • NOT TO GEOGRAPHIC SCALE • NOT A BOUNDARY MAP</text>

  <!-- Central Schematic Silhouette of Chhattisgarh (3 Zones) -->
  <!-- Zone 1: Northern Hills (Surguja / Hasdeo) -->
  <g id="zone-north" transform="translate(40, 20)">
    <path d="M 330 110 C 370 90, 430 85, 460 115 C 480 135, 490 165, 470 190 C 440 215, 380 220, 330 200 C 310 180, 300 140, 330 110 Z"
          fill="#21513F" fill-opacity="0.75" stroke="#A7B6A0" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="400" y="150" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">NORTHERN HILLS</text>
    <text x="400" y="168" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Surguja • Hasdeo Basin • Sal Forests</text>
  </g>

  <!-- Mahanadi River Flow Schematic -->
  <path d="M 320 370 C 340 330, 390 310, 440 290 C 490 270, 520 280, 570 270"
        fill="none" stroke="#A7B6A0" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>
  <text x="575" y="275" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="11" font-style="italic">Mahanadi River Basin →</text>

  <!-- Zone 2: Central Plains (Mahanadi Basin, Raipur, Sirpur) -->
  <g id="zone-central" transform="translate(40, 20)">
    <path d="M 300 215 C 370 210, 480 205, 530 250 C 560 290, 540 350, 480 375 C 410 395, 330 385, 290 340 C 270 290, 260 230, 300 215 Z"
          fill="#173D32" fill-opacity="0.9" stroke="#C3A56B" stroke-width="2.5"/>
    <text x="410" y="245" fill="#C3A56B" font-family="'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">CENTRAL MAHANADI PLAINS</text>
    <text x="410" y="264" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Rice-growing heartland • Urban &amp; Administrative Corridor</text>
  </g>

  <!-- Zone 3: Southern Bastar Plateau (Indravati River, Chitrakote, Kanger) -->
  <g id="zone-south" transform="translate(40, 20)">
    <path d="M 310 390 C 370 380, 460 385, 470 420 C 480 460, 450 510, 400 525 C 350 535, 300 500, 280 460 C 270 420, 280 400, 310 390 Z"
          fill="#21513F" fill-opacity="0.85" stroke="#B96548" stroke-width="2.5"/>
    <text x="375" y="445" fill="#e0bd7f" font-family="'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="1" text-anchor="middle">SOUTHERN BASTAR PLATEAU</text>
    <text x="375" y="464" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Dense Forest Canopy • Karst Caves • Tribal Artisans</text>
  </g>

  <!-- Indravati River Schematic -->
  <path d="M 470 470 C 420 480, 370 475, 310 490"
        fill="none" stroke="#C3A56B" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85"/>
  <text x="475" y="475" fill="#C3A56B" font-family="'Inter', sans-serif" font-size="10" font-style="italic">← Indravati River</text>

  <!-- Key Locations Callouts -->
  <!-- 1. Raipur (Capital) -->
  <g id="loc-raipur" transform="translate(370, 305)">
    <circle cx="0" cy="0" r="8" fill="#C3A56B" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="4" fill="#102C26"/>
    <line x1="-12" y1="-8" x2="-90" y2="-45" stroke="#C3A56B" stroke-width="1.5"/>
    <rect x="-240" y="-70" width="145" height="42" rx="4" fill="#102C26" stroke="#C3A56B" stroke-width="1.2"/>
    <text x="-168" y="-53" fill="#C3A56B" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">RAIPUR</text>
    <text x="-168" y="-38" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">State Capital &amp; Trade</text>
  </g>

  <!-- 2. Sirpur & Barnawapara -->
  <g id="loc-sirpur" transform="translate(480, 290)">
    <circle cx="0" cy="0" r="7" fill="#F6F2E9" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="3.5" fill="#B96548"/>
    <line x1="8" y1="-6" x2="60" y2="-35" stroke="#F6F2E9" stroke-width="1.5"/>
    <rect x="65" y="-55" width="165" height="42" rx="4" fill="#102C26" stroke="#F6F2E9" stroke-width="1.2"/>
    <text x="148" y="-38" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">SIRPUR &amp; DAKSHIN KOSALA</text>
    <text x="148" y="-23" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">5th–8th C. Heritage on Mahanadi</text>
  </g>

  <!-- 3. Chitrakote Falls -->
  <g id="loc-chitrakote" transform="translate(370, 485)">
    <circle cx="0" cy="0" r="7" fill="#B96548" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="3.5" fill="#F6F2E9"/>
    <line x1="-8" y1="8" x2="-65" y2="35" stroke="#B96548" stroke-width="1.5"/>
    <rect x="-225" y="20" width="155" height="42" rx="4" fill="#102C26" stroke="#B96548" stroke-width="1.2"/>
    <text x="-148" y="37" fill="#e0bd7f" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CHITRAKOTE FALLS</text>
    <text x="-148" y="52" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">~300 m Horseshoe Cascade</text>
  </g>

  <!-- 4. Kanger Valley & Bastar Dokra -->
  <g id="loc-kanger" transform="translate(440, 500)">
    <circle cx="0" cy="0" r="7" fill="#C3A56B" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="3.5" fill="#173D32"/>
    <line x1="8" y1="8" x2="65" y2="35" stroke="#C3A56B" stroke-width="1.5"/>
    <rect x="70" y="20" width="165" height="42" rx="4" fill="#102C26" stroke="#C3A56B" stroke-width="1.2"/>
    <text x="153" y="37" fill="#C3A56B" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">KANGER VALLEY &amp; DOKRA</text>
    <text x="153" y="52" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Sal Forests &amp; Bell-Metal Craft</text>
  </g>

  <!-- Legend / Footnote -->
  <g transform="translate(40, 545)">
    <rect x="0" y="0" width="720" height="32" rx="3" fill="#102C26" stroke="#173D32" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#C3A56B"/>
    <text x="32" y="20" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">Capital &amp; Urban Hub</text>

    <circle cx="170" cy="16" r="4" fill="#F6F2E9"/>
    <text x="182" y="20" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">Ancient Heritage</text>

    <circle cx="310" cy="16" r="4" fill="#B96548"/>
    <text x="322" y="20" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">River &amp; Waterfall</text>

    <circle cx="450" cy="16" r="4" fill="#e0bd7f"/>
    <text x="462" y="20" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">Forest Sanctuary &amp; Tribal Craft</text>

    <text x="705" y="20" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="9.5" text-anchor="end">Conceptual guide · Non-cartographic</text>
  </g>
</svg>
