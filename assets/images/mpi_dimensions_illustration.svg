<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-labelledby="mpi-title mpi-desc">
  <title id="mpi-title">National Multidimensional Poverty Index (MPI) Framework</title>
  <desc id="mpi-desc">Infographic showing the 3 equal dimensions (Health, Education, Standard of Living) and 12 weighted indicators used by NITI Aayog to measure multidimensional poverty.</desc>
  <defs>
    <linearGradient id="bg-grad-mpi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102C26"/>
      <stop offset="100%" stop-color="#173D32"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad-mpi)"/>

  <!-- Title & Source Header -->
  <text x="40" y="44" fill="#F6F2E9" font-family="'DM Serif Display', Georgia, serif" font-size="20">NATIONAL MULTIDIMENSIONAL POVERTY INDEX (MPI)</text>
  <text x="40" y="66" fill="#A7B6A0" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">NITI AAYOG &amp; OPHI METHODOLOGY • 3 EQUAL DIMENSIONS • 12 WEIGHTED INDICATORS</text>

  <!-- 3 Equal Dimensions Grid -->
  <!-- Dimension 1: Health (1/3 Weight) -->
  <g transform="translate(40, 95)">
    <rect width="226" height="340" rx="4" fill="#173D32" stroke="#B96548" stroke-width="2"/>
    <rect width="226" height="48" rx="4" fill="#B96548"/>
    <text x="113" y="28" fill="#F6F2E9" font-family="'DM Serif Display', Georgia, serif" font-size="16" text-anchor="middle">1. HEALTH</text>
    <text x="113" y="42" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10" font-weight="600" opacity="0.9" text-anchor="middle">TOTAL WEIGHT: 1/3 (33.3%)</text>

    <!-- Indicators -->
    <!-- Indicator 1 -->
    <rect x="12" y="62" width="202" height="74" rx="3" fill="#102C26" stroke="rgba(246, 242, 233, 0.1)"/>
    <text x="22" y="82" fill="#C3A56B" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Nutrition</text>
    <text x="194" y="82" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="10" text-anchor="end">1/6 wt</text>
    <text x="22" y="99" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">BMI / undernutrition in women,</text>
    <text x="22" y="115" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">men, or stunting/wasting in children.</text>

    <!-- Indicator 2 -->
    <rect x="12" y="146" width="202" height="62" rx="3" fill="#102C26" stroke="rgba(246, 242, 233, 0.1)"/>
    <text x="22" y="166" fill="#C3A56B" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Child-Adolescent Mortality</text>
    <text x="194" y="166" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="10" text-anchor="end">1/12 wt</text>
    <text x="22" y="183" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">Death of any child &lt; 18 yrs in the</text>
    <text x="22" y="197" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">household in 5 years prior to survey.</text>

    <!-- Indicator 3 -->
    <rect x="12" y="218" width="202" height="62" rx="3" fill="#102C26" stroke="rgba(246, 242, 233, 0.1)"/>
    <text x="22" y="238" fill="#C3A56B" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Maternal Health</text>
    <text x="194" y="238" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="10" text-anchor="end">1/12 wt</text>
    <text x="22" y="255" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">Women who have given birth without</text>
    <text x="22" y="269" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">at least 4 ANC visits or skilled delivery.</text>

    <text x="113" y="315" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="10" font-style="italic" text-anchor="middle">Key driver of rural index gap</text>
  </g>

  <!-- Dimension 2: Education (1/3 Weight) -->
  <g transform="translate(286, 95)">
    <rect width="226" height="340" rx="4" fill="#173D32" stroke="#C3A56B" stroke-width="2"/>
    <rect width="226" height="48" rx="4" fill="#C3A56B"/>
    <text x="113" y="28" fill="#102C26" font-family="'DM Serif Display', Georgia, serif" font-size="16" text-anchor="middle">2. EDUCATION</text>
    <text x="113" y="42" fill="#102C26" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">TOTAL WEIGHT: 1/3 (33.3%)</text>

    <!-- Indicators -->
    <rect x="12" y="62" width="202" height="110" rx="3" fill="#102C26" stroke="rgba(246, 242, 233, 0.1)"/>
    <text x="22" y="84" fill="#C3A56B" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Years of Schooling</text>
    <text x="194" y="84" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="10" text-anchor="end">1/6 wt</text>
    <text x="22" y="103" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">No household member aged 10+</text>
    <text x="22" y="119" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">has completed 6 years of</text>
    <text x="22" y="135" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">formal schooling.</text>

    <rect x="12" y="184" width="202" height="110" rx="3" fill="#102C26" stroke="rgba(246, 242, 233, 0.1)"/>
    <text x="22" y="206" fill="#C3A56B" font-family="'Inter', sans-serif" font-size="12" font-weight="700">School Attendance</text>
    <text x="194" y="206" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="10" text-anchor="end">1/6 wt</text>
    <text x="22" y="225" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">Any school-age child not</text>
    <text x="22" y="241" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">attending school up to the</text>
    <text x="22" y="257" fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">age of completing class 8.</text>

    <text x="113" y="320" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="10" font-style="italic" text-anchor="middle">Generational human capital</text>
  </g>

  <!-- Dimension 3: Standard of Living (1/3 Weight) -->
  <g transform="translate(532, 95)">
    <rect width="228" height="340" rx="4" fill="#173D32" stroke="#A7B6A0" stroke-width="2"/>
    <rect width="228" height="48" rx="4" fill="#21513F"/>
    <text x="114" y="28" fill="#F6F2E9" font-family="'DM Serif Display', Georgia, serif" font-size="16" text-anchor="middle">3. STANDARD OF LIVING</text>
    <text x="114" y="42" fill="#C3A56B" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">TOTAL WEIGHT: 1/3 (7 INDICATORS)</text>

    <!-- 7 Indicators compacted list -->
    <g transform="translate(14, 58)">
      <g fill="#F6F2E9" font-family="'Inter', sans-serif" font-size="10.5">
        <text x="8" y="16" font-weight="600" fill="#C3A56B">Cooking Fuel (1/21)</text>
        <text x="8" y="30" fill="rgba(246, 242, 233, 0.85)">Firewood, dung, charcoal use</text>

        <text x="8" y="52" font-weight="600" fill="#C3A56B">Sanitation (1/21)</text>
        <text x="8" y="66" fill="rgba(246, 242, 233, 0.85)">Unimproved / shared toilet</text>

        <text x="8" y="88" font-weight="600" fill="#C3A56B">Drinking Water (1/21)</text>
        <text x="8" y="102" fill="rgba(246, 242, 233, 0.85)">Unsafe source / &gt;30 min walk</text>

        <text x="8" y="124" font-weight="600" fill="#C3A56B">Housing (1/21)</text>
        <text x="8" y="138" fill="rgba(246, 242, 233, 0.85)">Kutcha roof, walls or floor</text>

        <text x="8" y="160" font-weight="600" fill="#C3A56B">Electricity (1/21)</text>
        <text x="8" y="174" fill="rgba(246, 242, 233, 0.85)">No electrical connection</text>

        <text x="8" y="196" font-weight="600" fill="#C3A56B">Assets (1/21)</text>
        <text x="8" y="210" fill="rgba(246, 242, 233, 0.85)">Lacking &gt;1 small asset</text>

        <text x="8" y="232" font-weight="600" fill="#C3A56B">Bank Account (1/21)</text>
        <text x="8" y="246" fill="rgba(246, 242, 233, 0.85)">No member has bank account</text>
      </g>
    </g>
  </g>

  <!-- Footnote -->
  <text x="400" y="475" fill="#A7B6A0" font-family="'Inter', sans-serif" font-size="10.5" text-anchor="middle">Poverty Cutoff: A person is multidimensionally poor if their deprivation score across these indicators is ≥ 33.3% (1/3).</text>
</svg>
